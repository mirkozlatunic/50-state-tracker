<!doctype html>
{# The shared layout. Other pages "extend" this file and fill in the blocks. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}50 States{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('main.states') }}">50 States Tracker</a>
    <p class="progress">{{ visited_count }} of {{ total_states }}</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
